<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The long way home</title>
<meta name="description" content="A night drive in the rain with a car radio that re-grades the city. Fan-made, for fun.">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/season-drive.css">
<style>
  html, body { margin: 0; height: 100%; background: #04060c; }
  #drive { width: 100%; height: 100svh; min-height: 560px; }
  #sound {
    position: fixed; top: 14px; right: 14px; z-index: 10;
    font: 500 14px/1 'Saira Semi Condensed', 'Arial Narrow', sans-serif;
    color: #d9dbe2; background: rgba(8, 9, 12, 0.7); border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 16px; padding: 8px 14px; cursor: pointer;
  }
  #sound:focus-visible { outline: 2px solid #ffa658; outline-offset: 3px; }
</style>
</head>
<body>
<div id="drive"></div>
<button id="sound" type="button" aria-pressed="false">Sound off</button>

<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/season/previews.js"></script>
<script src="js/season/drive.js"></script>
<script>
  (function () {
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
    var audio = window.Sound.scope();
    var opts = {
      albums: window.DISCOGRAPHY,
      audio: audio,
      reducedMotion: function () { return reduced.matches; },
      openRoom: function (id) { location.href = 'rooms.html#/' + id; },
      listenUrl: function (track) { return 'https://open.spotify.com/search/' + encodeURIComponent(track.title + ' The 1975'); }
    };
    window.__driveOpts = opts;
    window.__drive = window.NightDrive.mount(document.getElementById('drive'), opts);

    var btn = document.getElementById('sound');
    function paint(on) { btn.textContent = on ? 'Sound on' : 'Sound off'; btn.setAttribute('aria-pressed', on ? 'true' : 'false'); }
    btn.addEventListener('click', function () { window.Sound.toggle(); });
    window.Sound.onChange(paint);
  })();
</script>
</body>
</html>
